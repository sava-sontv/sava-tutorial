<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Savrse Tutorial Manager</title>
    <script>
      // Disable auto-initialization
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>

  <body>
    <script>
      function getSubfolderFromFilterUrl() {
        var pathParam = '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var hashQuery = hash.indexOf('?') !== -1 ? hash.slice(hash.indexOf('?')) : '';
        var queryString = hashQuery || search;
        if (queryString) {
          var params = new URLSearchParams(queryString);
          pathParam = params.get('path') || '';
        }
        if (pathParam) {
          return pathParam;
        }
        var match = hash.match(/\/filter\/([^/]+)/);
        return match ? match[1] : '';
      }

      var SelectWithFilterDefaultControl = createClass({
        getInitialState: function () {
          return { options: [] };
        },
        componentDidMount: function () {
          var opts = this.props.field && this.props.field.get('options');
          if (opts && opts.toJS) {
            this.setState({ options: opts.toJS() });
          } else if (Array.isArray(opts)) {
            this.setState({ options: opts });
          }
          var filterSubfolder = getSubfolderFromFilterUrl();
          if (filterSubfolder) {
            var options = opts ? (opts.toJS ? opts.toJS() : opts) : [];
            var valid = options.some(function (o) {
              return (o.value || o) === filterSubfolder;
            });
            if (valid) {
              this.props.onChange(filterSubfolder);
            }
          }
        },
        handleChange: function (e) {
          this.props.onChange(e.target.value);
        },
        render: function () {
          var value = this.props.value;
          var forID = this.props.forID;
          var className = this.props.classNameWrapper || this.props.className || '';
          var opts = this.state.options;
          if (!opts.length && this.props.field) {
            var fopts = this.props.field.get('options');
            opts = fopts && fopts.toJS ? fopts.toJS() : (Array.isArray(fopts) ? fopts : []);
          }
          var selectValue = value || (opts[0] && (opts[0].value || opts[0])) || '';
          return h('select', {
            id: forID,
            value: selectValue,
            onChange: this.handleChange,
            className: className,
          }, opts.map(function (opt) {
            var v = opt.value !== undefined ? opt.value : opt;
            var l = opt.label !== undefined ? opt.label : v;
            return h('option', { key: v, value: v }, l);
          }));
        },
      });

      CMS.registerWidget('selectWithFilterDefault', SelectWithFilterDefaultControl, null);

      const settingsConfig = {
        backend: {
          name: 'github',
          repo: 'sava-sontv/sava-tutorial', // vd: sontran/my-website
          branch: 'develop',
        },
        media_folder: 'static/img/uploads',
        public_folder: '/img/uploads',
      };

      // Config: file in 2-level folder, slug = filename (e.g. testing-123 → testing-123.md)

      const defaultFields = [
        { label: 'Title', name: 'title', widget: 'string' },
        {
          label: 'Slug (tên file)',
          name: 'slug',
          widget: 'string',
          hint: 'Tên file .md (vd: testing-123 → testing-123.md)',
          pattern: [
            '^[a-z0-9]+(?:-[a-z0-9]+)*$',
            'Chỉ chữ thường, số và dấu gạch ngang',
          ],
        },
        { label: 'Body', name: 'body', widget: 'markdown' },
        {
          label: 'Sort Index',
          name: 'sidebar_position',
          widget: 'number',
          required: false,
          value_type: 'int',
          default: 1,
        },
      ];

      const config = {
        create: true,
        slug: '{{subfolder}}/{{slug}}',
        extension: 'md',
        format: 'frontmatter',
        nested: {
          depth: 2,
          summary: '{{name}}',
          subfolders: false,
        },
        sortable_fields: ['sidebar_position', 'title'],
      };

      const folderOption = {
        label: 'Folder (cấp 2)',
        name: 'subfolder',
        widget: 'selectWithFilterDefault',
      };

      var accountLoginSubfolderOptions = [
        { label: 'Account creation & management', value: 'account-creation-and-management' },
        { label: 'Login & password troubleshooting', value: 'login-and-password-troubleshooting' },
      ];

      // Nhiều folder, mỗi folder nhiều .md: docs/account-and-login-issues/<subfolder>/<slug>.md
      // Dùng selectWithFilterDefault: khi tạo mới từ .../filter/<subfolder> thì chọn sẵn subfolder đó
      const accountAndLoginIssuesCollection = {
        name: 'account-and-login-issues',
        label: 'Account & Login Issues',
        folder: 'docs/account-and-login-issues',
        fields: [
          {
            ...folderOption,
            options: accountLoginSubfolderOptions,
            default: 'account-creation-and-management',
          },
        ].concat(defaultFields),
        ...config,
      };

      const communityAndSafetyCollection = {
        name: 'community-and-safety',
        label: 'Community & Safety',
        folder: 'docs/community-and-safety',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Community Guidelines',
                value: 'community-guidelines',
              },
              {
                label: 'Reporting & moderation',
                value: 'reporting-and-moderation',
              },
            ],
            default: 'community-guidelines',
          },
        ].concat(defaultFields),
        ...config,
      };

      const creatingInSavrseCollection = {
        name: 'creating-in-savrse',
        label: 'Creating in Savrse',
        folder: 'docs/creating-in-savrse',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'World Creation Basics',
                value: 'world-creation-basics',
              },
              {
                label: 'Creation Policies & Guidelines',
                value: 'creation-policies-and-guidelines',
              },
            ],
            default: 'world-creation-basics',
          },
        ].concat(defaultFields),
        ...config,
      };

      const exploringAndSocializingCollection = {
        name: 'exploring-and-socializing',
        label: 'Exploring & Socializing',
        folder: 'docs/exploring-and-socializing',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Finding And Joining Worlds',
                value: 'finding-and-joining-worlds',
              },
              {
                label: 'Social Features',
                value: 'social-features',
              },
            ],
            default: 'finding-and-joining-worlds',
          },
        ].concat(defaultFields),
        ...config,
      };

      const gettingStartedCollection = {
        name: 'getting-started',
        label: 'Getting Started',
        folder: 'docs/getting-started',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Introduction To Savrse',
                value: 'introduction-to-savrse',
              },
              {
                label: 'Onboarding and VR Basic',
                value: 'onboarding-and-vr-basic',
              },
            ],
            default: 'introduction-to-savrse',
          },
        ].concat(defaultFields),
        ...config,
      };

      const technicalSupportCollection = {
        name: 'technical-support',
        label: 'Technical Support',
        folder: 'docs/technical-support',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Connection Issues',
                value: 'connection-issues',
              },
              {
                label: 'Audio Problems',
                value: 'audio-problems',
              },
              {
                label: 'Performance Issues',
                value: 'performance-issues',
              },
              {
                label: 'Hardware And Device Support',
                value: 'hardware-and-device-support',
              },
            ],
            default: 'connection-issues',
          },
        ].concat(defaultFields),
        ...config,
      };

      CMS.init({
        config: {
          ...settingsConfig,
          collections: [
            gettingStartedCollection,
            accountAndLoginIssuesCollection,
            technicalSupportCollection,
            exploringAndSocializingCollection,
            communityAndSafetyCollection,
            creatingInSavrseCollection,
          ],
        },
      });
    </script>
  </body>
</html>
