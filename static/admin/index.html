<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Savrse Tutorial Manager</title>
    <script>
      // Disable auto-initialization
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>

  <body>
    <script>
      const settingsConfig = {
        backend: {
          name: 'github',
          repo: 'sava-sontv/sava-tutorial', // vd: sontran/my-website
          branch: 'develop',
        },
        media_folder: 'static/img/uploads',
        public_folder: '/img/uploads',
      };

      // Config: file in 2-level folder, slug = filename (e.g. testing-123 → testing-123.md)

      const defaultFields = [
        { label: 'Title', name: 'title', widget: 'string' },
        {
          label: 'Slug (tên file)',
          name: 'slug',
          widget: 'string',
          hint: 'Tên file .md (vd: testing-123 → testing-123.md)',
          pattern: [
            '^[a-z0-9]+(?:-[a-z0-9]+)*$',
            'Chỉ chữ thường, số và dấu gạch ngang',
          ],
        },
        { label: 'Body', name: 'body', widget: 'markdown' },
        {
          label: 'Sort Index',
          name: 'sidebar_position',
          widget: 'number',
          required: false,
          value_type: 'int',
          default: 1,
        },
      ];

      const config = {
        create: true,
        slug: '{{subfolder}}/{{slug}}',
        extension: 'md',
        format: 'frontmatter',
        nested: {
          depth: 2,
          summary: '{{name}}',
          subfolders: false,
        },
        sortable_fields: ['sidebar_position', 'title'],
      };

      const folderOption = {
        label: 'Folder (cấp 2)',
        name: 'subfolder',
        widget: 'select',
      };

      // Nhiều folder, mỗi folder nhiều .md: docs/account-and-login-issues/<subfolder>/<slug>.md
      const accountAndLoginIssuesCollection = {
        name: 'account-and-login-issues',
        label: 'Account & Login Issues',
        folder: 'docs/account-and-login-issues',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Account creation & management',
                value: 'account-creation-and-management',
              },
              {
                label: 'Login & password troubleshooting',
                value: 'login-and-password-troubleshooting',
              },
            ],
            default: 'account-creation-and-management',
          },
        ].concat(defaultFields),
        ...config,
      };

      const communityAndSafetyCollection = {
        name: 'community-and-safety',
        label: 'Community & Safety',
        folder: 'docs/community-and-safety',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Community Guidelines',
                value: 'community-guidelines',
              },
              {
                label: 'Reporting & moderation',
                value: 'reporting-and-moderation',
              },
            ],
            default: 'community-guidelines',
          },
        ].concat(defaultFields),
        ...config,
      };

      const creatingInSavrseCollection = {
        name: 'creating-in-savrse',
        label: 'Creating in Savrse',
        folder: 'docs/creating-in-savrse',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'World Creation Basics',
                value: 'world-creation-basics',
              },
              {
                label: 'Creation Policies & Guidelines',
                value: 'creation-policies-and-guidelines',
              },
            ],
            default: 'world-creation-basics',
          },
        ].concat(defaultFields),
        ...config,
      };

      const exploringAndSocializingCollection = {
        name: 'exploring-and-socializing',
        label: 'Exploring & Socializing',
        folder: 'docs/exploring-and-socializing',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Finding And Joining Worlds',
                value: 'finding-and-joining-worlds',
              },
              {
                label: 'Social Features',
                value: 'social-features',
              },
            ],
            default: 'finding-and-joining-worlds',
          },
        ].concat(defaultFields),
        ...config,
      };

      const gettingStartedCollection = {
        name: 'getting-started',
        label: 'Getting Started',
        folder: 'docs/getting-started',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Introduction To Savrse',
                value: 'introduction-to-savrse',
              },
              {
                label: 'Onboarding and VR Basic',
                value: 'onboarding-and-vr-basic',
              },
            ],
            default: 'introduction-to-savrse',
          },
        ].concat(defaultFields),
        ...config,
      };

      const technicalSupportCollection = {
        name: 'technical-support',
        label: 'Technical Support',
        folder: 'docs/technical-support',
        fields: [
          {
            ...folderOption,
            options: [
              {
                label: 'Connection Issues',
                value: 'connection-issues',
              },
              {
                label: 'Audio Problems',
                value: 'audio-problems',
              },
              {
                label: 'Performance Issues',
                value: 'performance-issues',
              },
              {
                label: 'Hardware And Device Support',
                value: 'hardware-and-device-support',
              },
            ],
            default: 'connection-issues',
          },
        ].concat(defaultFields),
        ...config,
      };

      CMS.init({
        config: {
          ...settingsConfig,
          collections: [
            gettingStartedCollection,
            accountAndLoginIssuesCollection,
            technicalSupportCollection,
            exploringAndSocializingCollection,
            communityAndSafetyCollection,
            creatingInSavrseCollection,
          ],
        },
      });
    </script>
  </body>
</html>
